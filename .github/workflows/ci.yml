name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # PageProps / RouteContext are global types Next.js generates into .next/types
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run contract:check
      - run: npm run build
